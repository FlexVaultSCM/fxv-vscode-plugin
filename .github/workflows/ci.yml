name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Schemas and captured envelopes both live upstream; nothing is copied in.
      - uses: actions/checkout@v7
        with:
          repository: FlexVaultSCM/fxv-api-rs
          path: fxv-api-rs

      - run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run compile

      # types.generated.ts is committed, so this is what stops it drifting.
      - name: Generated types are current
        env:
          FXV_SCHEMAS_DIR: fxv-api-rs/schemas
        run: |
          npm run types:generate
          git diff --exit-code -- src/cli/types.generated.ts \
            || { echo "::error::src/cli/types.generated.ts is out of date with the fxv-api-rs schemas. Run 'npm run types:generate' and commit the result."; exit 1; }

      - name: Unit tests
        env:
          FXV_FIXTURES_DIR: fxv-api-rs/tests/fixtures
        run: npm run test:unit

      - name: Package (dry run)
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: flexvault-vscode.vsix
          if-no-files-found: error

  integration:
    name: Extension host tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Discovery and path handling differ on all three.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Linux needs a display for the extension host; macOS and Windows have one.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
