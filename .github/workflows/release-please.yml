name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Force this exact version (e.g. 1.0.0) instead of the auto-computed bump. Leave blank for normal behavior.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          release-as: ${{ github.event_name == 'workflow_dispatch' && inputs.release_as || '' }}
          skip-github-pull-request: ${{ github.event_name == 'push' }}
          skip-github-release: ${{ github.event_name == 'workflow_dispatch' }}

  publish-vsix:
    name: Build & attach VSIX
    needs: release-please
    if: needs['release-please'].outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs['release-please'].outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Stamp version
        shell: bash
        run: |
          version="${{ needs['release-please'].outputs.tag_name }}"
          clean_version="${version#v}"
          npm version "$clean_version" --no-git-tag-version --allow-same-version

      - name: Package extension
        shell: bash
        run: |
          version="${{ needs['release-please'].outputs.tag_name }}"
          clean_version="${version#v}"
          asset="flexvault-vscode-${clean_version}.vsix"
          npx vsce package --no-dependencies -o "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs['release-please'].outputs.tag_name }}" \
            "${{ env.asset }}" \
            "${{ env.asset }}.sha256" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Publish to VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath "${{ env.asset }}" --skip-duplicate
          else
            echo "VSCE_PAT not set, skipping VS Code Marketplace publish"
          fi

      - name: Publish to Open VSX
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish "${{ env.asset }}" --skip-duplicate
          else
            echo "OVSX_PAT not set, skipping Open VSX publish"
          fi
